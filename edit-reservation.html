<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Edit Reservation</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link href="css/style.css" rel="stylesheet" />
  </head>

  <body>
    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" href="dashboard.html">
          Meeting Room Reservation
        </a>

        <div>
          <a href="my-reservations.html" class="btn btn-light btn-sm me-2">
            My Reservations
          </a>

          <button class="btn btn-light btn-sm" onclick="logoutUser()">
            Logout
          </button>
        </div>
      </div>
    </nav>

    <!-- CONTENT -->

    <div class="container mt-4">
      <div class="card shadow">
        <div class="card-header">
          <h4 class="mb-0">Edit Reservation</h4>
        </div>

        <div class="card-body">
          <form onsubmit="updateReservation(event)">
            <input type="hidden" id="reservationId" />

            <div class="mb-3">
              <label class="form-label"> Meeting Title </label>

              <input type="text" id="title" class="form-control" required />
            </div>

            <div class="mb-3">
              <label class="form-label"> Reservation Date </label>

              <input
                type="date"
                id="reservationDate"
                class="form-control"
                required
              />
            </div>

            <div class="row">
              <div class="col-md-6">
                <div class="mb-3">
                  <label class="form-label"> Start Time </label>

                  <input
                    type="time"
                    id="startTime"
                    class="form-control"
                    required
                  />
                </div>
              </div>

              <div class="col-md-6">
                <div class="mb-3">
                  <label class="form-label"> End Time </label>

                  <input
                    type="time"
                    id="endTime"
                    class="form-control"
                    required
                  />
                </div>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label"> Notes </label>

              <textarea id="notes" rows="4" class="form-control"></textarea>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-success">
                Update Reservation
              </button>

              <a href="my-reservations.html" class="btn btn-secondary">
                Cancel
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/common.js"></script>
    <script src="js/reservations.js"></script>
  </body>
</html>
